<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>회차별 기출 실전 시험</title><link rel="stylesheet" href="exam.css?v=2"></head><body><main><header><a href="../">⌂ 홈</a><h1>기출 실전 시험</h1></header><section id="setup"><h2>회차 선택</h2><p>회차를 선택하면 바로 시작해. 원래 과목의 80문항·120분 시험이며 공식 확정 정답 검증은 완료되지 않았어.</p><button id="retry" hidden>다시 불러오기</button><p id="status" role="status">기출문제 불러오는 중…</p><div id="rounds"></div><button id="variants" hidden>수정 학습문항 9개</button><button id="resume" hidden>이전 시험 이어 풀기</button><button id="lastResult" hidden>최근 시험 결과 보기</button><button id="historyEntry" type="button">기출 누적 오답노트</button><section id="historyPanel" hidden><h2>회차별 기출 오답노트</h2><p>당시 과목 기준 · 검수 보류 및 수정 학습문항 제외 · 참고 정답 기준 · 이 브라우저에 저장</p><p id="legacySummary" role="status"></p><div class="history-filters"><label>복습 상태 <select id="legacyScope"><option value="pending">복습 필요</option><option value="resolved">복습 완료</option><option value="all">전체 오답 이력</option></select></label><label>과목 <select id="legacySubject"><option value="all">전체 과목</option><option value="legacy_mechanics">일반기계공학</option><option value="legacy_engine">자동차엔진</option><option value="legacy_chassis">자동차섀시</option><option value="legacy_electrical">자동차전기</option></select></label><label>회차 <select id="legacyDate"><option value="all">전체 회차</option><option value="2020-08-22">2020-08-22</option><option value="2020-06-06">2020-06-06</option><option value="2019-08-04">2019-08-04</option><option value="2019-04-27">2019-04-27</option><option value="2019-03-03">2019-03-03</option><option value="2018-08-19">2018-08-19</option><option value="2018-04-28">2018-04-28</option><option value="2018-03-04">2018-03-04</option></select></label></div><p><a href="../index.html?view=wrong">일반 문제 오답노트</a></p><div id="legacyList"></div></section></section><section id="exam" hidden><div class="bar"><span id="position"></span><strong id="timer"></strong><button id="submit">시험 종료</button></div><div id="warning" class="warning" hidden></div><h2 id="stem"></h2><div id="choices"></div><div class="bar"><button id="prev">이전</button><button id="next">다음</button></div><div id="numbers" aria-label="문항 이동"></div></section><section id="results" hidden><h2>시험 결과</h2><div id="summary"></div><button id="wrong">오답·미응답·보류만 보기</button><button id="all">전체 보기</button><button id="back">회차 선택</button><button id="resultHistory">기출 누적 오답노트</button><div id="review"></div></section><section id="practice" hidden><h2 id="practiceTitle"></h2><h2 id="practiceStem"></h2><div id="practiceChoices"></div><div id="practiceFeedback" role="status" hidden></div><button id="practiceBack" type="button">오답 목록으로 돌아가기</button></section></main><script src="exam.js?v=review05-auto4"></script></body></html>
