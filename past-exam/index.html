<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>개인 보관 기출 실전 시험</title><link rel="stylesheet" href="exam.css"></head><body><main><header><a href="../">⌂ 홈</a><h1>기출 실전 시험</h1></header><section id="setup"><h2>회차 선택</h2><p>개인 보관용 JSON을 불러와. 서버 전송 없이 브라우저에서 처리해. 원래 과목의 80문항·120분 시험이며 공식 확정 정답 검증은 완료되지 않았어.</p><label>개인 시험 JSON <input type="file" id="file" accept=".json,application/json"></label><button id="forget" hidden>저장 자료 삭제</button><p id="status" role="status"></p><div id="rounds"></div><button id="variants" hidden>수정 학습문항 9개</button><button id="resume" hidden>이전 시험 이어 풀기</button></section><section id="exam" hidden><div class="bar"><span id="position"></span><strong id="timer"></strong><button id="submit">시험 종료</button></div><div id="warning" class="warning" hidden></div><h2 id="stem"></h2><div id="choices"></div><div class="bar"><button id="prev">이전</button><button id="next">다음</button></div><div id="numbers" aria-label="문항 이동"></div></section><section id="results" hidden><h2>시험 결과</h2><div id="summary"></div><button id="wrong">오답·미응답·보류만 보기</button><button id="all">전체 보기</button><button id="back">회차 선택</button><div id="review"></div></section></main><script src="exam.js"></script></body></html>
