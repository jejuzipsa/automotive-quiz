name: Validate automotive quiz JSON bank

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "quiz-utils.js"
      - "data/**"
      - "tests/**"
      - ".github/workflows/check-qa7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bundled JSON banks and quiz behavior
        run: |
          node tests/validate.cjs
          node tests/json-bank.test.cjs
          node tests/draft-bank.test.cjs
          node tests/draft-bank-rounds.test.cjs
          node tests/technical-qa1.test.cjs
          node tests/technical-qa2.test.cjs
          node tests/technical-qa3.test.cjs
          node tests/technical-qa4.test.cjs
          node tests/technical-qa5.test.cjs
          node tests/technical-qa6.test.cjs
          node tests/technical-qa7.test.cjs
          node tests/technical-qa8.test.cjs
          node tests/technical-qa9.test.cjs
          node tests/technical-qa10.test.cjs
          node tests/technical-qa11.test.cjs
          node tests/technical-qa12-13.test.cjs
          node tests/technical-qa14.test.cjs
          node tests/technical-qa15.test.cjs
          node tests/technical-qa16.test.cjs
          node tests/technical-qa17.test.cjs
          node tests/technical-qa18.test.cjs
          node tests/technical-qa19.test.cjs
          node tests/technical-qa20.test.cjs
          node tests/technical-qa21.test.cjs
          node tests/technical-qa22.test.cjs
          node tests/technical-qa23.test.cjs
          node tests/technical-qa24.test.cjs
          node tests/technical-qa25.test.cjs
          node tests/technical-qa26.test.cjs
          node tests/technical-qa27.test.cjs
          node tests/technical-qa28.test.cjs
          node tests/technical-qa29.test.cjs
          node tests/technical-qa30-33.test.cjs
          node tests/technical-qa34-37.test.cjs
          QA38_REPORT_OUT=qa38-review-queue.json node tests/qa38-final-review-queue.test.cjs
          node tests/technical-qa39.test.cjs
          node tests/technical-qa40.test.cjs
          node tests/technical-qa41.test.cjs
          node tests/technical-qa42.test.cjs
          node tests/technical-qa43-45.test.cjs
          QA46_REVIEW_OUT=qa46-specialist-queue.json node tests/qa46-specialist-review-queue.test.cjs
          QA47_PACKET_OUT=qa47-first20-review-packet.json node tests/qa47-first20-source-review-packet.test.cjs
          QA52_OUT_DIR=qa52-working-bank node tests/qa51-52-working-bank.test.cjs
          QA39_SUBJECT_REPORT_OUT=qa39-subject-review.json node tests/qa39-subject-triage.test.cjs
          QA19_REPORT_OUT=qa19-review-queue.json node tests/qa19-round05-09-risk-queue.test.cjs
          QA5_REPORT_OUT=qa5-report.json node tests/qa5-bank-integrity.test.cjs
          node tests/release-gate.test.cjs
      - name: Upload QA58 versioned working bank and 20 pending batches (not approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa58-working-bank-and-remaining-400
          path: qa52-working-bank/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload QA47 20-question source preflight and reviewer packet (not approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa47-first20-review-packet
          path: qa47-first20-review-packet.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload QA46 720-question specialist review queue (not approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa46-specialist-review-720
          path: qa46-specialist-queue.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload QA39 55 hold provisional subject scope queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa39-subject-review-55
          path: qa39-subject-review.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload QA38 720-question final-review risk candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa38-final-review-queue
          path: qa38-review-queue.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload QA5 720-question machine audit (review only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa5-720-integrity-audit
          path: qa5-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload QA19 400-question review queue (risk candidates, NOT approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa19-r05-r09-review-queue
          path: qa19-review-queue.json
          if-no-files-found: warn
          retention-days: 30
