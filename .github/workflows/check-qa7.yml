name: Validate automotive quiz JSON bank

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "quiz-utils.js"
      - "data/**"
      - "tests/**"
      - ".github/workflows/check-qa7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bundled JSON banks and quiz behavior
        run: |
          node tests/validate.cjs
          node tests/json-bank.test.cjs
          node tests/draft-bank.test.cjs
          node tests/draft-bank-rounds.test.cjs
          node tests/technical-qa1.test.cjs
          node tests/technical-qa2.test.cjs
          node tests/technical-qa3.test.cjs
          node tests/technical-qa4.test.cjs
          node tests/technical-qa5.test.cjs
          node tests/technical-qa6.test.cjs
          node tests/technical-qa7.test.cjs
          node tests/technical-qa8.test.cjs
          node tests/technical-qa9.test.cjs
          node tests/technical-qa10.test.cjs
          QA5_REPORT_OUT=qa5-report.json node tests/qa5-bank-integrity.test.cjs
          node tests/release-gate.test.cjs
      - name: Upload QA5 720-question machine audit (review only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa5-720-integrity-audit
          path: qa5-report.json
          if-no-files-found: warn
          retention-days: 30
