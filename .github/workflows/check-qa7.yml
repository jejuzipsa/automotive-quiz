name: Validate automotive quiz and private bank reader

on:
  push:
    branches: [main]
    paths:
      - "private.html"
      - "private-bank.js"
      - "private-bank.css"
      - "vendor/**"
      - "tests/**"
      - "index.html"
      - "app.js"
      - "data/questions.js"
      - ".github/workflows/check-qa7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify site and local QA7 bank import
        run: |
          node tests/validate.cjs
          node tests/private-bank.test.cjs
