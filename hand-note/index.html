<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8f7">
<link rel="icon" type="image/png" href="../assets/automotive-icon.png">
<title>한손노트 | 자동차정비산업기사</title>
<script>try{const t=JSON.parse(localStorage.getItem("automotiveQuizThemeV1")||"null");document.documentElement.dataset.theme=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch{document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="note.css?v=1">
</head>
<body>
<main class="shell">
<header class="top">
  <div class="brand"><img src="../assets/hand-note-icon.png" alt="" aria-hidden="true"><span>자동차정비산업기사</span></div>
  <div class="top-actions">
    <a class="back" href="../index.html">홈으로</a>
    <button class="control" id="noteTheme" type="button" aria-label="테마 전환">☾</button>
    <div class="size-group" role="group" aria-label="글자 크기">
      <button class="control" type="button" data-size="small" aria-pressed="false">A−</button><button class="control" type="button" data-size="normal" aria-pressed="true">A</button><button class="control" type="button" data-size="large" aria-pressed="false">A+</button>
    </div>
  </div>
</header>
<section id="noteHome" class="page" aria-labelledby="noteTitle">
  <p class="eyebrow">MY STUDY NOTE</p><h1 id="noteTitle">한손노트</h1>
  <p class="lead">문제 해설과 핵심 단어 카드의 관련 개념을 PART · POINT 단위로 묶었어. 과목을 선택해서 한 장씩 읽어봐.</p>
  <div id="noteSubjects" class="subject-list"></div>
  <p id="noteTotal" class="note-hint" role="status">학습 자료를 불러오는 중이야.</p>
</section>
<section id="noteReader" hidden aria-labelledby="readerTitle">
  <div class="page">
    <div class="reader-head"><div><p class="eyebrow">MY STUDY NOTE</p><h1 id="readerTitle">한손노트</h1></div><button id="noteBack" class="control" type="button">과목 선택</button></div>
    <div class="selectors">
      <label>PART · 단원<select id="notePart"></select></label>
      <label>POINT · 학습 페이지<select id="notePoint"></select></label>
    </div>
    <div class="progress-row"><span id="noteProgress" aria-live="polite"></span><div class="progress-track" aria-hidden="true"><span id="noteProgressFill"></span></div></div>
    <article id="notePage" aria-labelledby="pointTitle">
      <div id="partLabel" class="part-label"></div><h2 id="pointTitle" class="note-heading" tabindex="-1"></h2>
      <div id="notePoints"></div>
      <details class="source-details" id="noteSources"><summary>참고한 문제 ID</summary><p id="noteSourceIds"></p></details>
    </article>
    <p class="note-hint">좌우로 밀거나 이전·다음 버튼으로 이동해. 위에서 다른 단원을 바로 선택할 수도 있어.</p>
  </div>
  <nav class="reader-nav" aria-label="학습 페이지 이동"><button class="control" id="notePrev" type="button">‹ 이전</button><span class="range" id="noteRange"></span><button class="control next" id="noteNext" type="button">다음 ›</button></nav>
</section>
<p class="foot">© 2026 제주집사 · 기존 학습문제와 카드 해설 기반 · 독립 기술감수 자료 아님</p>
</main>
<script src="../core-cards/data.js?v=1"></script><script src="model.js?v=1"></script><script src="note.js?v=1"></script>
</body></html>
